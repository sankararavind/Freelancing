name: Deploy to GitHub Pages

on:
  push:
    branches:
      - preview/freelancing_branch1
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/Freelancing/"

      - name: Add SPA fallback and .nojekyll
        run: |
          cp dist/developer-portfolio/browser/index.html dist/developer-portfolio/browser/404.html
          touch dist/developer-portfolio/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/developer-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
