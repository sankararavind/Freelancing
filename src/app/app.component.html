<app-transition></app-transition>

<!-- Animated background orbs -->
<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <div class="grid-overlay"></div>
  <div class="noise"></div>
</div>

<!-- Scroll progress -->
<div class="scroll-progress" #scrollProgress></div>

<!-- Side scroll indicator -->
<aside class="side-rail" aria-hidden="true">
  <div class="rail-line"><i [style.height.%]="railFill"></i></div>
  <ul class="rail-dots">
    <li *ngFor="let s of sections" [class.active]="activeSection === s.id"></li>
  </ul>
</aside>

<app-navbar></app-navbar>
<main>
  <app-hero></app-hero>
  <div class="section-divider" aria-hidden="true">
    <span class="sd-line"></span>
    <span class="sd-glyph">✦</span>
    <span class="sd-line"></span>
  </div>
  <app-services></app-services>
  <div class="section-divider" aria-hidden="true">
    <span class="sd-line"></span>
    <span class="sd-glyph">✧</span>
    <span class="sd-line"></span>
  </div>
  <app-portfolio></app-portfolio>
  <div class="section-divider" aria-hidden="true">
    <span class="sd-line"></span>
    <span class="sd-glyph">▲</span>
    <span class="sd-line"></span>
  </div>
  <app-contact></app-contact>
</main>
<footer class="glass">
  <div class="footer-content">
    <p>&copy; 2026 Charlotte. Crafted with passion.</p>
  </div>
</footer>

<style>
  main {
    width: 100%;
    overflow-x: hidden;
    position: relative;
    z-index: 1;
  }

  footer {
    padding: 60px 0;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 1;
  }

  footer p {
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.9rem;
    background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0.9), rgba(255,255,255,0.3));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    display: inline-block;
  }

  @keyframes shine {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Animated background orbs */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    will-change: transform;
  }

  .orb-1 {
    width: 500px;
    height: 500px;
    top: -10%;
    left: -10%;
    background: radial-gradient(circle, var(--accent-color), transparent 70%);
    animation: float1 20s ease-in-out infinite;
  }

  .orb-2 {
    width: 420px;
    height: 420px;
    bottom: 10%;
    right: -8%;
    background: radial-gradient(circle, #6a00ff, transparent 70%);
    opacity: 0.25;
    animation: float2 28s ease-in-out infinite;
  }

  .orb-3 {
    width: 360px;
    height: 360px;
    top: 50%;
    left: 40%;
    background: radial-gradient(circle, #00b2ff, transparent 70%);
    opacity: 0.15;
    animation: float3 22s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(120px, 80px) scale(1.2); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-80px, -100px) scale(1.15); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-40%, -60%) scale(1.3); }
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }

  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  /* Scroll progress */
  .scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0;
    background: linear-gradient(90deg, var(--accent-color), #ff9a3c);
    box-shadow: 0 0 14px var(--accent-glow);
    z-index: 9998;
    transition: width 0.1s linear;
  }

  /* Side rail */
  .side-rail {
    position: fixed;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    z-index: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }

  .rail-line {
    width: 2px;
    height: 120px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .rail-line i {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, var(--accent-color), #ff9a3c);
    box-shadow: 0 0 8px var(--accent-color);
    transition: height 0.2s linear;
  }

  .rail-dots {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rail-dots li {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                background 0.4s ease;
  }

  .rail-dots li.active {
    transform: scale(1.6);
    background: var(--accent-color);
    box-shadow: 0 0 12px var(--accent-color);
  }

  /* Section dividers */
  .section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 0;
    position: relative;
    z-index: 1;
  }

  .sd-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.12) 50%,
      transparent 100%);
    position: relative;
    overflow: hidden;
  }

  .sd-line::after {
    content: '';
    position: absolute;
    top: 0;
    left: -30%;
    width: 30%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent,
      var(--accent-color),
      transparent);
    animation: dividerSweep 6s ease-in-out infinite;
  }

  @keyframes dividerSweep {
    0%   { left: -30%; }
    50%  { left: 100%; }
    100% { left: 100%; }
  }

  .sd-glyph {
    color: var(--accent-color);
    font-size: 1.1rem;
    animation: spinSlow 14s linear infinite;
    display: inline-block;
  }

  @media (max-width: 1100px) {
    .side-rail { display: none; }
  }
</style>
